name: CI

# WHEN this runs. A pull request targeting main triggers it, and every
# subsequent push to that PR branch re-triggers it.
on:
  pull_request:
    branches: [ main ]

# Cancel an in-progress run if new commits arrive on the same PR. Without
# this you queue runs for code nobody is looking at any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest        # the runner image

    steps:
      # Clone the repo onto the runner. Nothing works without this.
      - uses: actions/checkout@v4

      # Install Node 20 and enable npm's dependency cache, keyed on the
      # lockfile. Unchanged dependencies restore from cache instead of
      # downloading 267 packages again.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      # ---- Invitation API (api/) -------------------------------------------
      # Same job, not a separate one, so the existing required `build` check
      # in the MainBranch ruleset covers the API with no settings change.
      # Runs BEFORE the portal's `npm ci` on purpose: the API must build and
      # test with only its own dependencies, exactly as deploy-api.yml does.
      # With the portal's node_modules present, a dependency leak (vitest
      # loading the root postcss/tailwind config) passed CI and failed
      # Deploy - API #1.
      # The unit tests are the server-side checks of runbook WS3.3 and the
      # token validation; a red test here is a security regression.
      - name: API — install
        working-directory: api
        run: npm ci

      - name: API — audit runtime dependencies
        working-directory: api
        run: npm audit --omit=dev --audit-level=high

      - name: API — typecheck, unit tests, bundle
        working-directory: api
        run: |
          npm run typecheck
          npm test
          npm run build
          test -f dist/index.js

      # Lockfile-exact install. Fails if package.json and the lockfile
      # disagree - which is what you want.
      - run: npm ci

      # Lint. ESLint 9 flat config (eslint.config.js): recommended JS and
      # TypeScript rules plus the React hooks rules, which catch real bugs
      # such as stale closures and conditionally-called hooks. Warnings do
      # not fail the job; errors do.
      - run: npm run lint

      # Dependency audit, RUNTIME dependencies only (--omit=dev). Build tools
      # such as vite and tailwindcss never reach a partner's browser, so a
      # finding in them is not a finding in the portal. Fails on high or
      # critical. Moderate findings are reported in the log but do not block.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      # Build. package.json runs `tsc -b && vite build`, so TypeScript
      # errors fail here. This is the real gate.
      - run: npm run build

      # Optional but useful: prove the build actually produced output.
      # A build that "succeeds" and emits nothing is a real failure mode.
      - name: Verify build output
        run: test -f dist/index.html || (echo "dist/index.html missing" && exit 1)

      # staticwebapp.config.json carries the security headers, the SPA routing
      # fallback and (in prod) the Front Door origin lock. The workflows upload
      # dist/ only, so it must be built INTO dist/ — it lives in public/ for
      # that reason. It was at the repo root until 14 Oct 2026 and silently
      # never deployed.
      - name: SWA config is in the build output
        run: |
          test -f dist/staticwebapp.config.json || { echo "::error::dist/staticwebapp.config.json missing — it must live in public/"; exit 1; }
          python3 -m json.tool dist/staticwebapp.config.json >/dev/null
          echo "OK: staticwebapp.config.json present and valid."

      # Disclosure check, same as deploy-prod.yml (WS1.3). Run here too so a PR
      # that re-imports an internal documentation page statically fails at
      # review, not weeks later at release time.
      - name: No internal documentation in the bundle
        run: |
          pattern='break-glass|Sentinel|NIST 800|Purview|Entra PIM'
          if grep -Eiol "$pattern" dist/assets/*.js; then
            echo "::error::Internal documentation found in the bundle (files above). See src/lib/admin-docs.ts."
            exit 1
          fi
          echo "OK: no internal documentation markers in dist/."

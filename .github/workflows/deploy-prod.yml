name: Deploy - prod

# Production never deploys on a push. It deploys only when someone either
#   - pushes a version tag (v1.0.0, v1.0.1, ...), or
#   - runs this workflow by hand from the Actions tab,
# and then a named reviewer approves the `prod` environment. That approval
# is the release gate; it is configured on the environment in repository
# settings, not in this file (see "One-time setup" in CLAUDE.md).
#
# deploy-dev.yml is unchanged: every merge to main still goes to dev.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

# One production deploy at a time, and never cancel one half-way through.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write   # OIDC for azure/login, when infra steps are added
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Guard: only code that is already on main may reach production.
  # A tag can point at any commit, including one on an unmerged branch that
  # never went through CI review. This job refuses those.
  # ---------------------------------------------------------------------------
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so merge-base can see main

      - name: Commit must be on main
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "OK: $GITHUB_SHA is on main."
          else
            echo "::error::$GITHUB_SHA is not on main. Merge through a pull request first."
            exit 1
          fi

  build:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      # Production build settings, stated explicitly rather than inherited.
      #   VITE_DEMO_MODE empty  -> live mode only; personas, seeded folder tree
      #                            and the mock invitation dialog are removed
      #                            by dead-code elimination.
      #   VITE_INCLUDE_ADMIN_DOCS=false -> internal documentation pages are not
      #                            emitted (WS1.3). False is also the default;
      #                            stated so nobody "fixes" it by flipping it.
      - name: Build
        run: npm run build
        env:
          VITE_DEMO_MODE: ""
          VITE_INCLUDE_ADMIN_DOCS: "false"
          # Invitation UI (WS3). On since the API (secureshare-api), its
          # Invitations.ReadWrite scope and the managed-identity grants
          # (Guest Inviter; Groups Administrator on the Guest Groups AU) were
          # in place. Setting it back to "false" hides the page and restores
          # the pre-API copy; the API itself is unaffected.
          VITE_INVITATIONS_ENABLED: "true"
          VITE_SPA_CLIENT_ID: d25ef5a7-5e7a-4ebf-a06e-f3cbf047294d   # cs-secure-share-prod-spa

      # The SPA client ID falls back to the DEV registration when the variable
      # is missing. That fallback is right for local work and wrong here, so
      # prove the bundle carries the prod ID and not the dev one.
      - name: Bundle uses the prod app registration
        run: |
          grep -q "d25ef5a7-5e7a-4ebf-a06e-f3cbf047294d" dist/assets/*.js \
            || { echo "::error::Prod SPA client ID not found in the bundle."; exit 1; }
          if grep -q "212f8c25-c2f7-4e09-a316-280dd4c89e73" dist/assets/*.js; then
            echo "::error::Dev SPA client ID found in the prod bundle."; exit 1
          fi
          echo "OK: bundle signs in through cs-secure-share-prod-spa."

      # Disclosure gate. The admin documentation pages name internal security
      # tooling, the NIST control inventory and the break-glass procedure. They
      # must never ship in the internet-facing bundle. Since WS1.3 they are
      # excluded at build time (src/lib/admin-docs.ts); this step proves it on
      # every release. If it fails, the fix is in the build, not in this list.
      - name: No internal documentation in the bundle
        run: |
          pattern='break-glass|Sentinel|NIST 800|Purview|Entra PIM'
          if grep -Eiol "$pattern" dist/assets/*.js; then
            echo "::error::Internal documentation found in the production bundle (files above). See WS1.3."
            grep -Eioh "$pattern" dist/assets/*.js | sort | uniq -c
            exit 1
          fi
          echo "OK: no internal documentation markers in dist/."

      - name: SWA config is in the build output
        run: |
          test -f dist/staticwebapp.config.json || { echo "::error::dist/staticwebapp.config.json missing — it must live in public/"; exit 1; }
          python3 -m json.tool dist/staticwebapp.config.json >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: spa-dist-prod
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The approval gate. Required reviewers on this environment pause the job
    # here until a reviewer approves in the Actions UI.
    environment: prod
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: spa-dist-prod
          path: dist/

      # A missing secret resolves to an empty string with no warning, and the
      # deploy action then fails with an unrelated-looking error. Check first.
      - name: Check required settings
        env:
          TOKEN: ${{ secrets.SWA_DEPLOYMENT_TOKEN_PROD }}
          PROD_URL: ${{ vars.PROD_URL }}
        run: |
          missing=0
          [ -n "$TOKEN" ]    || { echo "::error::Environment secret SWA_DEPLOYMENT_TOKEN_PROD is not set on the prod environment."; missing=1; }
          [ -n "$PROD_URL" ] || { echo "::error::Environment variable PROD_URL is not set on the prod environment."; missing=1; }
          exit $missing

      # -----------------------------------------------------------------------
      # Front Door origin lock (WS2.4)
      #
      # When the prod environment variable AFD_FDID is set, add a
      # forwardingGateway block so the Static Web App answers ONLY requests that
      # arrive through Signode's Front Door profile, for the PROD_URL hostname.
      # Direct requests to the *.azurestaticapps.net hostname then get 403, so
      # the WAF cannot be bypassed.
      #
      # It is injected here, not committed in public/staticwebapp.config.json,
      # because the same file deploys to dev (Free tier, not behind Front Door),
      # and because the lock must switch on only AFTER every public hostname
      # resolves through Front Door — otherwise the live URL starts returning
      # 403. Turning the lock on or off is a variable change plus a release.
      #
      # The Front Door ID is not a secret (it is in CLAUDE.md, in a public repo).
      # Front Door overwrites X-Azure-FDID with the true profile ID, so another
      # Front Door profile cannot spoof it — but a client talking DIRECTLY to
      # the *.azurestaticapps.net origin can send any header it likes. So the
      # lock is two layers, both from Microsoft's Front Door + SWA guidance:
      #   networking.allowedIpRanges = ["AzureFrontDoor.Backend"]
      #       only Front Door's egress IPs reach the origin at all (service
      #       tag, shared by all Front Door customers), and
      #   forwardingGateway.requiredHeaders X-Azure-FDID
      #       of those, only Signode's profile is accepted.
      # -----------------------------------------------------------------------
      - name: Front Door origin lock
        env:
          AFD_FDID: ${{ vars.AFD_FDID }}
          PROD_URL: ${{ vars.PROD_URL }}
        run: |
          # Keep an unlocked copy of the build. If the locked site fails the
          # smoke test, the rollback step below redeploys this copy.
          cp -r dist dist-unlocked
          if [ -z "$AFD_FDID" ]; then
            echo "::warning::AFD_FDID not set — origin lock OFF. The Static Web App is reachable without Front Door."
            exit 0
          fi
          # SWA compares X-Azure-FDID case-sensitively and byte-for-byte. A
          # pasted space, newline or quote takes the whole site down with a 403
          # (14 Oct 2026). Strip them, then refuse anything that is not a GUID
          # BEFORE deploying.
          fdid=$(printf '%s' "$AFD_FDID" | tr -d '[:space:]"'"'"'')
          if ! printf '%s' "$fdid" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "::error::AFD_FDID is not a lowercase GUID after trimming (got ${#fdid} chars). Copy the Front Door ID from the profile's Overview blade."
            exit 1
          fi
          [ "$fdid" = "$AFD_FDID" ] || echo "::warning::AFD_FDID contained whitespace or quotes; they were stripped. Fix the variable."
          # Precondition: PROD_URL must actually be served THROUGH Front Door.
          # Front Door stamps every response with x-azure-ref. If it is missing,
          # the hostname reaches the SWA directly (DNS still pointing at the
          # origin, or the domain still bound on the SWA), requests carry no
          # X-Azure-FDID, and locking would 403 every visitor. That is what
          # happened on 14 Oct 2026; refuse instead of deploying.
          if ! curl -s -o /dev/null -D - --max-time 15 "$PROD_URL" | grep -qi '^x-azure-ref:'; then
            echo "::error::$PROD_URL is not served through Front Door (no x-azure-ref header). Fix DNS / SWA custom domains before turning the lock on."
            exit 1
          fi
          host="${PROD_URL#https://}"; host="${host%%/*}"
          jq --arg fdid "$fdid" --arg host "$host" \
             '.forwardingGateway = {requiredHeaders: {"X-Azure-FDID": $fdid}, allowedForwardedHosts: [$host]}
              | .networking.allowedIpRanges = ["AzureFrontDoor.Backend"]' \
             dist/staticwebapp.config.json > config.tmp && mv config.tmp dist/staticwebapp.config.json
          echo "Origin lock ON: Front Door $fdid, host $host"
          jq '{forwardingGateway, networking}' dist/staticwebapp.config.json

      - name: Deploy to Static Web Apps (prod)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN_PROD }}
          action: upload
          app_location: "dist"
          skip_app_build: true

      # PROD_URL is an environment variable, not a hard-coded hostname, so the
      # cutover to secureshare.signode.com (WS2.2) is a settings change.
      - name: Smoke test
        id: smoke
        env:
          PROD_URL: ${{ vars.PROD_URL }}
        # Retry for up to 5 minutes. A new staticwebapp.config.json (for example
        # switching the origin lock on) takes a while to reach every SWA edge,
        # and a single check after a fixed sleep failed on the first locked
        # release (14 Oct 2026). Every attempt's status is printed so a real
        # failure (persistent 403 = lock rejecting Front Door) is diagnosable.
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$PROD_URL")
            echo "Attempt $i: $PROD_URL returned $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "::error::$PROD_URL did not return 200 within 5 minutes (last: $code). If 403 persists, the origin lock is rejecting Front Door traffic — unset AFD_FDID and redeploy."
          exit 1

      # Evidence for the security review: with the lock on, the origin itself
      # must refuse direct traffic. PROD_ORIGIN_URL is the SWA default hostname.
      - name: Origin refuses direct access
        if: ${{ vars.AFD_FDID != '' && vars.PROD_ORIGIN_URL != '' }}
        env:
          ORIGIN: ${{ vars.PROD_ORIGIN_URL }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$ORIGIN")
          echo "Direct origin $ORIGIN returned $code"
          test "$code" = "403" || { echo "::error::Origin answered $code without Front Door — the lock is not effective."; exit 1; }

      # -----------------------------------------------------------------------
      # Origin-lock diagnostics (runs only when the locked site failed).
      # Probes the SWA origin directly with hand-built headers, while the lock
      # is still deployed, to isolate WHICH check is refusing traffic:
      #   A  no headers                      -> expect 403 (lock is active)
      #   B  FDID + X-Forwarded-Host=PROD    -> 200 means the SWA side accepts
      #      exactly what Front Door should send, so the fault is on the Front
      #      Door side (what it actually sends, or a cached 403)
      #   C  FDID only                       -> does a missing forwarded host block?
      #   D  FDID + X-Forwarded-Host=*.azurefd.net
      # Plus the response headers Front Door returns for PROD_URL (x-cache shows
      # a cached 403). With networking.allowedIpRanges on, the runner is not a
      # Front Door IP, so B-D also return 403: that is the IP layer working,
      # and the probes then only tell you the lock is active. To isolate the
      # header layer again, temporarily drop the allowedIpRanges line above.
      # -----------------------------------------------------------------------
      - name: Diagnose origin lock
        if: ${{ failure() && steps.smoke.outcome == 'failure' && vars.AFD_FDID != '' && vars.PROD_ORIGIN_URL != '' }}
        env:
          AFD_FDID: ${{ vars.AFD_FDID }}
          PROD_URL: ${{ vars.PROD_URL }}
          ORIGIN: ${{ vars.PROD_ORIGIN_URL }}
        run: |
          fdid=$(printf '%s' "$AFD_FDID" | tr -d '[:space:]"'"'"'')
          host="${PROD_URL#https://}"; host="${host%%/*}"
          afd="SecureSharePortal-hydpg2b4gwegg6cn.a01.azurefd.net"
          probe() { printf '%-40s %s\n' "$1" "$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "${@:2}" "$ORIGIN")"; }
          echo "== Direct to origin $ORIGIN =="
          probe "A  no headers"
          probe "B  FDID + XFH=$host"                 -H "X-Azure-FDID: $fdid" -H "X-Forwarded-Host: $host"
          probe "C  FDID only"                        -H "X-Azure-FDID: $fdid"
          probe "D  FDID + XFH=azurefd endpoint"      -H "X-Azure-FDID: $fdid" -H "X-Forwarded-Host: $afd"
          echo; echo "== Through Front Door: $PROD_URL =="
          curl -s -o /dev/null -D - --max-time 15 "$PROD_URL" | grep -Ei '^(HTTP|x-cache|x-azure-ref|cache-control|age|content-type)' || true
          echo; echo "== Body of the 403 (first 300 bytes) =="
          curl -s --max-time 15 "$PROD_URL" | head -c 300; echo

      # -----------------------------------------------------------------------
      # Automatic rollback of the origin lock.
      # If the smoke test fails while the lock is on, redeploy the same build
      # WITHOUT forwardingGateway so the portal comes back immediately, then
      # still fail the run so the problem is visible. Added after the 14 Oct
      # 2026 release where a lock mismatch returned 403 to every visitor and
      # recovery needed a second gated release.
      # -----------------------------------------------------------------------
      - name: Roll back origin lock (redeploy unlocked build)
        if: ${{ failure() && steps.smoke.outcome == 'failure' && vars.AFD_FDID != '' }}
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN_PROD }}
          action: upload
          app_location: "dist-unlocked"
          skip_app_build: true

      - name: Report rollback
        if: ${{ failure() && steps.smoke.outcome == 'failure' && vars.AFD_FDID != '' }}
        run: |
          echo "::error::Smoke test failed with the origin lock ON. The unlocked build was redeployed so the portal stays up. Check that AFD_FDID exactly equals the Front Door ID on the profile Overview blade, then unset it until fixed."
          exit 1
